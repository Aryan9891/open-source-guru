name: Deploy

# Deploys images built by docker-build-push.yml to the VPS over SSH (see docs/deployment.md).
# The `production` environment holds:
#   secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (private key), VPS_KNOWN_HOSTS (`ssh-keyscan <host>` output)
#   variables: DEPLOY_PATH (optional, default /root/open-source-guru)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (a commit SHA built by the Docker Build Push workflow). Empty = the selected branch's latest commit.
        required: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    # Turned off for now: deployments are done by hand on the VPS (docs/deployment.md).
    # Remove this line to deploy from GitHub Actions again.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      TAG: ${{ inputs.tag || github.sha }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/root/open-source-guru' }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' \
            "$VPS_HOST" "$VPS_USER" > ~/.ssh/config

      - name: Upload compose file
        run: scp docker-compose.prod.yml "vps:$DEPLOY_PATH/docker-compose.prod.yml"

      - name: Pull and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        # The tag is saved in the server's .env, so manual `docker compose` commands there
        # keep running the deployed version. The registry login only lasts for this job.
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh vps docker login ghcr.io -u "$ACTOR" --password-stdin
          ssh vps bash -s -- "$DEPLOY_PATH" "$TAG" <<'EOF'
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null' EXIT
          cd "$1"
          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$2/" .env
          grep -q "^IMAGE_TAG=$2$" .env || { echo "IMAGE_TAG is missing from .env" >&2; exit 1; }
          docker compose -f docker-compose.prod.yml pull --quiet
          docker compose -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 180
          docker image prune -f
          EOF
