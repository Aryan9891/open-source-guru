name: Documentation
description: Something in the docs is wrong, unclear or missing.
title: "docs: "
labels: [documentation]
body:
  - type: dropdown
    id: where
    attributes:
      label: Which documentation?
      options:
        - User docs (open-source-guru.dev/docs)
        - API reference
        - README or contributor docs (CONTRIBUTING.md, docs/)
        - Code comments
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Page or file
      description: A link to the page, or the path of the file.
      placeholder: https://open-source-guru.dev/docs/streaks

  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing?
      description: Quote the confusing part if you can, and tell us what you were trying to find out.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
      description: Optional. Small fixes are also very welcome as a pull request directly.
