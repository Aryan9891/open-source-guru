  </g>
  <text x="196" y="186" class="display" font-size="62" fill="#F6EEFB">Open source <tspan fill="#E47676">guru</tspan></text>
  <text x="84" y="294" class="sans" font-size="38" font-weight="500" fill="#F6EEFB">Find issues to work on,</text>
  <text x="84" y="344" class="sans" font-size="38" font-weight="500" fill="#F6EEFB">the moment they're labeled.</text>

  <rect x="84" y="384" width="190" height="38" rx="19" fill="#E47676"/>
  <text x="179" y="409" text-anchor="middle" class="mono" font-size="16" fill="#1F024C">good first issue</text>
  <rect x="286" y="384" width="146" height="38" rx="19" fill="#3A1468"/>
  <text x="359" y="409" text-anchor="middle" class="mono" font-size="16" fill="#F6EEFB">help wanted</text>
  <rect x="444" y="384" width="160" height="38" rx="19" fill="#3A1468"/>
  <text x="524" y="409" text-anchor="middle" class="mono" font-size="16" fill="#F6EEFB">documentation</text>

  <text x="84" y="480" class="mono" font-size="17" fill="#BCA7D3">Email alerts · Streaks · Goals · Public profile · API</text>
  <text x="84" y="540" class="mono" font-size="20" font-weight="500" fill="#E47676">open-source-guru.dev</text>

  <!-- Right: a notification email -->
  <g transform="translate(770 112) scale(1.1) translate(-810 -58)">
