    .display { font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; letter-spacing: -0.02em; }
    .sans { font-family: 'Geist', system-ui, sans-serif; }
    .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12012E"/>
      <stop offset="0.55" stop-color="#1F024C"/>
      <stop offset="1" stop-color="#45056E"/>
    </linearGradient>
    <radialGradient id="glowOrchid" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8F1383" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8F1383" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCoral" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E47676" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#E47676" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#F6EEFB" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <circle cx="1100" cy="60" r="440" fill="url(#glowOrchid)"/>
  <circle cx="140" cy="660" r="380" fill="url(#glowCoral)"/>

