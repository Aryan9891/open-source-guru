    <line x1="830" y1="128" x2="1180" y2="128" stroke="#3A1468" stroke-width="1.5"/>
    <text x="830" y="160" class="sans" font-size="16.5" font-weight="600" fill="#F6EEFB">#482 Add keyboard shortcuts to the editor</text>
    <rect x="830" y="180" width="138" height="28" rx="14" fill="#E47676"/>
    <text x="899" y="199" text-anchor="middle" class="mono" font-size="12.5" fill="#1F024C">good first issue</text>
    <circle cx="988" cy="194" r="5" fill="#7EE2A8"/>
    <text x="1000" y="199" class="sans" font-size="14" fill="#BCA7D3">Unassigned, up for grabs</text>
  </g>

